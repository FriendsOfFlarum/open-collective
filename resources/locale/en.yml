fof-open-collective:
  admin:
    settings:
      title: FriendsOfFlarum Open Collective

      use_legacy_api_key_label: Use Legacy Application API Key
      use_legacy_api_key_help: >
        If you have a legacy API key, you may keep using it, but it is recommended to switch to a Personal Token.
        Currently, personal tokens seem to work in API Key mode (i.e. "API-Key" header), but this is not documented.

      api_key_label: Application API Key (deprecated)
      api_key_help: This authentication method is deprecated. Please consider switching to a Personal Token.

      personal_token_label: Personal Token
      personal_token_help: Create a personal token at <a>https://opencollective.com/applications</a> with the "orders" and "email" scopes, from an account that is an admin of the collective. This token is used to fetch your backer information from Open Collective.

      slug_label: Collective Slug
      slug_help: Enter your Open Collective collective slug (the part after opencollective.com/ in your collective URL).

      group_label: Recurring Backers Group
      group_help: Select which Flarum user group recurring backers should be added to. Users will be automatically added when they become recurring backers and moved to the one-time group (if configured) when their subscription ends.

      onetime_group_label: One-Time Backers Group (Optional)
      onetime_group_help: Select which Flarum user group one-time backers should be added to. If not set, one-time backers will not be managed. When a recurring backer cancels their subscription, they will be moved to this group.

# Audit log entries, rendered by flarum/audit when it is enabled.
flarum-audit:
  lib:
    browser:
      fof_open_collective:
        recurring_started: "{username} became a recurring backer on Open Collective. Groups: {old_groups} → {new_groups}"
        recurring_stopped: "{username}'s recurring backing on Open Collective stopped. Groups: {old_groups} → {new_groups}"
        onetime_started: "{username} became a one-time backer on Open Collective. Groups: {old_groups} → {new_groups}"
        backing_ended: "{username} is no longer an Open Collective backer. Groups: {old_groups} → {new_groups}"
        groups_changed: "Open Collective sync changed {username}'s groups from {old_groups} to {new_groups}"
